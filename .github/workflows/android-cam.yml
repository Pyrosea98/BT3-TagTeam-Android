name: android-cam

on:
  push:
    branches: [sparking-gameplay]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: port/build/android-toolchain/llvm
          key: llvm-21.1.0-linux-x64-v2
      - name: Engine toolchain
        working-directory: .
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh port/tools/android_toolchain.sh > toolchain.txt 2>&1 || { sh .github/annotate.sh toolchain.txt; exit 1; }
          tail -3 toolchain.txt
      - name: Engine
        working-directory: .
        env:
          BT3_SKELETON: "1"
        run: |
          python3 port/tools/android.py > engine_build.txt 2>&1 || true
          tail -5 engine_build.txt
          grep -q "^installed into" engine_build.txt || { grep -E "^FAILED|error|stubs|link|loader" engine_build.txt > engine_errors.txt || true; tail -30 engine_build.txt >> engine_errors.txt; sh .github/annotate.sh engine_errors.txt; exit 1; }
          sh .github/annotate.sh engine_build.txt notice
          ls -la android/app/src/main/jniLibs/arm64-v8a
      - name: Version
        run: |
          echo "DR_VERSION_NAME=0.0.0-cam.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "DR_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleCam > ../gradle.txt 2>&1 || { grep -E "^e: |error:|FAILURE|What went wrong" -A3 ../gradle.txt > ../gradle_errors.txt || true; tail -20 ../gradle.txt >> ../gradle_errors.txt; sh ../.github/annotate.sh ../gradle_errors.txt; exit 1; }
      - name: Collect APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/cam/app-cam.apk "../out/DragonRage-CAM-${DR_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DragonRage-CAM-${{ env.DR_VERSION_NAME }}
          path: out/*.apk
